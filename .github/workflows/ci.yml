name: ci

# Só checagem estática leve, em Linux: as suítes rodam no pre-check local antes de cada release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifestos na mesma versão
        run: node -e "const a=require('./package.json').version,b=require('./plugin.json').version;if(a!==b){console.error('package.json '+a+' != plugin.json '+b);process.exit(1)}console.log('versão '+a)"

      - name: JSON dos manifestos e da config válidos
        run: node -e "for(const f of ['package.json','plugin.json','hooks.json','config.default.json'])JSON.parse(require('fs').readFileSync(f,'utf8'))"
